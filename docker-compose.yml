services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - mnemos-db:/data
    environment:
      MNEMOS_DB_PATH: /data/mnemos.db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mnemos-db:
